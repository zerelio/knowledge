name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # zerelio/zerelio

jobs:
  release:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub release
      packages: write   # push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Zerelio
            org.opencontainers.image.description=Self-hosted infrastructure knowledge graph platform
            org.opencontainers.image.vendor=Zerelio
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker image

            ```
            docker pull ghcr.io/zerelio/zerelio:${{ github.ref_name }}
            ```

            ## Helm install

            ```bash
            helm repo add bitnami https://charts.bitnami.com/bitnami
            helm dependency build helm/zerelio
            helm install zerelio ./helm/zerelio \
              --set config.jwtSecret=$(openssl rand -hex 32) \
              --set postgresql.auth.postgresPassword=$(openssl rand -hex 24)
            ```

            ## Quick start (Docker Compose)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/zerelio/zerelio/${{ github.ref_name }}/docker-compose.yml | \
              ZERELIO_JWT_SECRET=$(openssl rand -hex 32) docker compose -f - up -d
            ```

            See [OPERATIONS.md](https://github.com/zerelio/zerelio/blob/main/OPERATIONS.md) for full deployment guide.
