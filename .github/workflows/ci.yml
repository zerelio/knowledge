name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# plugin-sdk is a sibling module referenced via go.mod replace directive.
# In CI we can't check it out at ../plugin-sdk (outside workspace), so we
# check it out at ./plugin-sdk and rewrite the replace before every Go step.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: plugin-sdk

      - name: Rewrite plugin-sdk replace for CI
        run: go mod edit -replace=github.com/zerelio/plugin-sdk=./plugin-sdk

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build -buildvcs=false ./...
        env:
          CGO_ENABLED: "0"

      - name: Test
        run: go test -buildvcs=false -race -count=1 -timeout 120s ./...
        # CGO_ENABLED=1 is required for the race detector (-race uses C).
        # This is safe on ubuntu-latest where the C toolchain is fully available.

      - name: Integration tests
        run: go test -buildvcs=false -tags=integration -race -count=1 -timeout 300s ./internal/storage/
        env:
          ZERELIO_INTEGRATION: "1"
          # CGO_ENABLED defaults to 1 — race detector requires it.

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: plugin-sdk

      - name: Rewrite plugin-sdk replace for CI
        run: go mod edit -replace=github.com/zerelio/plugin-sdk=./plugin-sdk

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...
        env:
          CGO_ENABLED: "0"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: plugin-sdk

      - name: Rewrite plugin-sdk replace for CI
        run: go mod edit -replace=github.com/zerelio/plugin-sdk=./plugin-sdk

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gosec
        uses: securego/gosec@master
        with:
          args: "-exclude=G104,G115 ./..."
        env:
          CGO_ENABLED: "0"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        env:
          CGO_ENABLED: "0"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: plugin-sdk

      - name: Rewrite plugin-sdk replace for CI
        run: go mod edit -replace=github.com/zerelio/plugin-sdk=./plugin-sdk

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - name: Generate SBOM
        run: cyclonedx-gomod mod -json -output bom.json
        env:
          CGO_ENABLED: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  license-boundary:
    name: OSS/Commercial boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify security/ does not import zerelio/internal/
        shell: bash
        run: |
          if [ -d "security" ]; then
            if grep -rn --include="*.go" "github.com/zerelio/knowledge/internal" security/ 2>/dev/null | grep -v "_test.go"; then
              echo "ERROR: security/ imports zerelio/internal/ — only public APIs allowed"
              exit 1
            fi
          fi
          echo "Boundary check passed"
