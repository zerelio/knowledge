name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # plugin-sdk replace directive (../plugin-sdk) requires the sibling repo.
      - uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: ../plugin-sdk
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build -buildvcs=false ./...
        env:
          CGO_ENABLED: "0"

      - name: Test
        run: go test -buildvcs=false -race -count=1 -timeout 120s ./...
        env:
          CGO_ENABLED: "0"

      - name: Integration tests
        run: go test -buildvcs=false -tags=integration -race -count=1 -timeout 300s ./internal/storage/
        env:
          ZERELIO_INTEGRATION: "1"
          CGO_ENABLED: "0"
        # Requires Docker — enabled on ubuntu-latest GitHub-hosted runners.

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: ../plugin-sdk
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Install from source so it compiles under Go 1.26 (pre-built binaries
      # are built with an older toolchain and refuse to lint go1.26 modules).
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...
        env:
          CGO_ENABLED: "0"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: ../plugin-sdk
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gosec
        uses: securego/gosec@master
        with:
          # G104: unhandled errors — excluded because deferred rows.Close()
          # is the standard database/sql pattern and not an actionable finding.
          # G115: int conversion — numeric range is validated before cast.
          args: "-exclude=G104,G115 ./..."
        env:
          CGO_ENABLED: "0"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        env:
          CGO_ENABLED: "0"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zerelio/plugin-sdk
          path: ../plugin-sdk
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - name: Generate SBOM
        run: cyclonedx-gomod mod -json -output bom.json
        env:
          CGO_ENABLED: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  license-boundary:
    name: OSS/Commercial boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify security/ does not import zerelio/internal/
        shell: bash
        run: |
          if [ -d "security" ]; then
            if grep -rn --include="*.go" "github.com/zerelio/zerelio/internal" security/ 2>/dev/null | grep -v "_test.go"; then
              echo "ERROR: security/ imports zerelio/internal/ — only public APIs allowed"
              exit 1
            fi
          fi
          echo "Boundary check passed"
