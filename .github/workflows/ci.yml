name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Test
        run: go test -buildvcs=false -race -count=1 -timeout 120s ./...

      - name: Vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  license-boundary:
    name: OSS/Commercial boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify security/ does not import knowledge/internal/
        shell: bash
        run: |
          # security/ may only depend on public knowledge APIs — never internal/ packages.
          # This check is a no-op until the security/ module exists.
          if [ -d "security" ]; then
            if grep -rn --include="*.go" "github.com/zerelio/zerelio/internal" security/ 2>/dev/null | grep -v "_test.go"; then
              echo "ERROR: security/ imports knowledge/internal/ — only public APIs allowed"
              exit 1
            fi
          fi
          echo "Boundary check passed"
