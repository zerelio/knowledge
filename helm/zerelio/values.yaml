## Zerelio Helm Chart — default values
## Override these in your values.yaml or via --set flags.

replicaCount: 1

image:
  repository: zerelio/zerelio
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: zerelio.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

## ── PostgreSQL (Bitnami sub-chart) ──────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    postgresPassword: change-me-in-production
    database: zerelio
  primary:
    initdb:
      scripts:
        init.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS age;

## ── External database (used when postgresql.enabled=false) ──────────────────
externalDatabase:
  host: ""
  port: 5432
  user: zerelio
  password: ""
  database: zerelio
  ## If set, the chart reads the DSN from key DATABASE_URL in this existing Secret
  ## instead of constructing it from the fields above.
  existingSecret: ""

## ── Application config ───────────────────────────────────────────────────────
config:
  ## JWT signing secret — MUST be overridden in production
  jwtSecret: change-me-in-production

  logLevel: info
  authDisabled: false
  schedulerEnabled: false

  oidc:
    issuer: ""
    clientId: ""
    clientSecret: ""
    redirectUrl: ""
    autoProvision: true
    defaultRoles: viewer

  llm:
    provider: ""
    apiKey: ""
    model: ""
    baseUrl: ""

  otel:
    endpoint: ""
    serviceName: zerelio

## ── ServiceAccount ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

## ── Pod metadata ─────────────────────────────────────────────────────────────
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

## ── Scheduling ───────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

## ── Probes ───────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
