apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zerelio.fullname" . }}
  labels:
    {{- include "zerelio.labels" . | nindent 4 }}
type: Opaque
{{- if not .Values.externalDatabase.existingSecret }}
data:
  ZERELIO_JWT_SECRET: {{ .Values.config.jwtSecret | b64enc | quote }}
  ZERELIO_DATABASE_URL: {{ include "zerelio.databaseURL" . | b64enc | quote }}
  {{- if .Values.config.llm.apiKey }}
  ZERELIO_LLM_API_KEY: {{ .Values.config.llm.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.oidc.clientSecret }}
  ZERELIO_OIDC_CLIENT_SECRET: {{ .Values.config.oidc.clientSecret | b64enc | quote }}
  {{- end }}
{{- else }}
# When externalDatabase.existingSecret is set the caller-managed Secret must
# contain key DATABASE_URL. JWT and other secrets are still managed here.
data:
  ZERELIO_JWT_SECRET: {{ .Values.config.jwtSecret | b64enc | quote }}
  {{- if .Values.config.llm.apiKey }}
  ZERELIO_LLM_API_KEY: {{ .Values.config.llm.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.oidc.clientSecret }}
  ZERELIO_OIDC_CLIENT_SECRET: {{ .Values.config.oidc.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
