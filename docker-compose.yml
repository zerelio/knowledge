version: "3.9"

services:
  postgres:
    image: apache/age:latest
    # Apache AGE includes PostgreSQL + the AGE graph extension.
    # For pgvector support, build a custom image or use pgvector/pgvector:pg16.
    # See docs/architecture/adr-004-storage-architecture.md for rationale.
    environment:
      POSTGRES_USER: zerelio
      POSTGRES_PASSWORD: zerelio_dev_only
      POSTGRES_DB: zerelio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./knowledge/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerelio"]
      interval: 5s
      timeout: 5s
      retries: 10

  zerelio:
    build:
      context: ./knowledge
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZERELIO_AUTH_DISABLED: "true"
      ZERELIO_ADDR: ":8080"
      ZERELIO_DATABASE_URL: "postgres://zerelio:zerelio_dev_only@postgres:5432/zerelio?sslmode=disable"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
